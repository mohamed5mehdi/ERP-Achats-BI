spring.application.name=procurement-management

# ── Database (PostgreSQL) ─────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procurement_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Docker Compose Support (Activé – gestion automatique par Spring Boot) ──
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=start-only

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.pfe.procurement=DEBUG
# Nécessaire : désactive la détection auto qui reprendrait H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# ── Server ────────────────────────────────────────────
server.port=${SERVER_PORT:8090}

# ── IA — Seuils Routage Dynamique (MAD) ────────────
bag.routing.seuil-daf=30000
bag.routing.seuil-dg=100000

# ── Security (JWT & CORS) ─────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3005

# ── LLM API (module Text-to-Dashboard) ────────────────
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent