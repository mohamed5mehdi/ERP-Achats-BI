services:
  db:
    image: postgres:15-alpine
    container_name: procurement-db
    environment:
      POSTGRES_DB: ${DB_NAME:-procurement_db}
      POSTGRES_USER: ${DB_USERNAME:?Copiez .env.example vers .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copiez .env.example vers .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?Copiez .env.example vers .env} -d ${DB_NAME:-procurement_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  procurement-app:
    build: .
    image: procurement-management-app:latest
    container_name: procurement-app
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8090
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-procurement_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?Copiez .env.example vers .env}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Copiez .env.example vers .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Copiez .env.example vers .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  frontend:
    build:
      context: ./frontend
    image: procurement-management-frontend:latest
    container_name: procurement-frontend
    ports:
      - "3000:80"
    healthcheck:
      disable: true
    depends_on:
      - procurement-app

volumes:
  postgres_data:

